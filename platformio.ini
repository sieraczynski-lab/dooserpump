; PlatformIO Project Configuration File
; Reef Aquarium Dosing Pump Controller
; ESP32-S3 Zero (4MB flash)

[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB

; Filesystem
board_build.filesystem = littlefs
board_build.partitions = partitions_4mb.csv

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DASYNCWEBSERVER_REGEX=1

; Libraries (mathieucarbou fork - maintained for ESP32 Arduino 3.x / IDF 5.x)
lib_deps =
    https://github.com/mathieucarbou/AsyncTCP.git#v3.3.2
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.6.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
